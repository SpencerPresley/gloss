# CANDIDATE eval cases — Track D expansion (2026-07-10). NOT scored yet.
#
# Provenance: each case was drafted while reading ONLY the source unit's verbatim
# `text` (+ chapter/section for the pin) — never the stored retrieval metadata
# (questions / key_terms / context_line / applies_when). Screened for word-4-gram
# overlap against that metadata by screen_candidates.py (kept in this directory).
# Candidates were NOT filtered by what the current system retrieves — admissibility
# was well-posedness only ("does this passage answer this query, and is it the
# passage a competent reader would want?"). Ambiguous cases OR-pin both fields
# (expect_section + expect_principle/expect_chapter are OR-matched by evalrun).
#
# The `# u<id> <section> <type>` comment above each case is the source unit.
#
# Vetting: Spencer reviews; approved cases are appended to cases.yaml under
#   # --- synthetic set (generated from verbatim text, vetted 2026-07-10) ---
# so curated-vs-synthetic can always be scored separately. Do not merge unvetted.
