[project]
name = "docq"
version = "0.1.1"
description = "Structured lexical retrieval from documents — turn a source text into a portable, cited, principle-anchored corpus."
readme = "README.md"
license = "MIT"
authors = [{ name = "Spencer Presley" }]
requires-python = ">=3.12"
dependencies = []  # query-time path is stdlib-only; nothing required to RUN `docq retrieve`

[project.urls]
Homepage = "https://github.com/SpencerPresley/docq"
Repository = "https://github.com/SpencerPresley/docq"
Issues = "https://github.com/SpencerPresley/docq/issues"
Changelog = "https://github.com/SpencerPresley/docq/releases"

[project.optional-dependencies]
# Build-time only: parsing + LLM enrichment. Never imported on the query path.
build = [
    "pymupdf>=1.24",
    "langchain>=1.3",
    "langchain-ollama>=1.1",
    "pydantic>=2.10",
    "pyyaml>=6",
]

[project.scripts]
docq = "docq.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docq"]
