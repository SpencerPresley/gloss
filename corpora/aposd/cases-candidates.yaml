  # ==== agent-voice tranche (2026-07-10) ====
  # Queries phrased the way the consuming agent (Claude, mid-workflow) actually
  # issues them, in the two intended workflows:
  #   [design]   task arrives -> skill invoked -> gloss consulted per design
  #              decision while ironing out the approach. Shape: prescriptive
  #              decision questions, alternatives held side by side, compact.
  #   [refactor] reviewing existing code for improvement. Shape: third-person
  #              descriptions of observed code, concrete identifiers/language
  #              vocabulary (python, asyncio, dict), present tense.
  # Drafting direction is FORWARD (unlike the tranche above): the query came
  # from workflow simulation first, then was pinned by locating the answering
  # passage — reading verbatim text only, same firewall, same 4-gram screen.
  # A few are deliberate voice-pairs of a dev-voice case above (marked): same
  # underlying situation, different register — they measure voice robustness.
  # Post-skill queries that reuse the book's own vocabulary are deliberately
  # EXCLUDED: the leakage firewall can't distinguish them from index echo, and
  # they're the easy case anyway. The future query-log path covers those.

